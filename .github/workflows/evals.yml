name: evals

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_judge:
        description: Also run the DeepEval judge on purpose (12 extra calls)
        type: boolean
        default: false

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extraction-evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/part-1/day-09-extraction-evals
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      RUN_JUDGE: ${{ inputs.run_judge && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      # Offline on every push and pull request: no API calls.
      - run: pytest -W ignore tests/test_matching.py
      # Live Gemini calls only when started by hand, to protect the free tier.
      - if: github.event_name == 'workflow_dispatch'
        run: pytest -W ignore tests/test_extraction.py
