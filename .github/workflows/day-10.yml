name: day-10

on:
  pull_request:
    paths:
      - "code/part-1/day-10-doc-qa-service/**"
      - ".github/workflows/day-10.yml"
  workflow_dispatch:   # manual fallback if a run fails on a free-tier limit

concurrency:
  group: day-10-${{ github.ref }}
  cancel-in-progress: false   # never stop a run midway: its calls would be wasted

permissions:
  contents: read

jobs:
  doc-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/part-1/day-10-doc-qa-service
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: day10
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/day10
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      LANGSMITH_TRACING: "false"
      PROMPT_VERSION: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: code/part-1/day-10-doc-qa-service/requirements.txt
      - run: pip install -r requirements.txt
      # Offline: 18 unit tests, no API calls.
      - run: pytest -W ignore tests
      # Live: 7 embedding requests to ingest.
      - run: python service.py ingest evals/docs --collection evals
      # Live: 4 query embeddings, 4 generations and 4 judge calls; gated on PASS_RATE.
      - run: pytest -W ignore -rxX evals
